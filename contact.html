<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - North Star Bakery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <img src="images/bakery-logo_c.png" alt="North Star Bakery logo" width="90" height="70">
        <h1>North Star Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Pre-Order &amp; Inquiry Form</h2>
            <p>Please submit your request at least 48 hours before your desired pickup date.</p>
        </section>

        <section>
            <form action="#" method="POST">
                <fieldset>
                    <legend>Contact Information</legend>
                    <p>
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name">
                    </p>
                    <p>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Order Details</legend>
                    <p>
                        <label for="pickup-date">Pickup Date:</label>
                        <input type="date" id="pickup-date" name="pickup-date" >
                    </p>
                    <p>
                        <label for="request-type">Request Type:</label>
                        <select id="request-type" name="request-type" >
                            <option value="">--Select an Option--</option>
                            <option value="pre-order">Product Pre-Order</option>
                            <option value="question">General Question</option>
                            <option value="catering">Catering Inquiry</option>
                        </select>
                    </p>
                    <p>
                        <label for="item-details">Item Details &amp; Quantities:</label>
                        <textarea id="item-details" name="item-details" rows="4" placeholder="e.g., 2 Signature Sourdough Loaves, 6 Croissants" ></textarea>
                    </p>
                    <p>
                        <label for="allergies">Allergy Notes (Optional):</label>
                        <textarea id="allergies" name="allergies" rows="2" placeholder="List any nut, dairy, or gluten sensitivities"></textarea>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Submit Request</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
    </footer>
</body>
</html>
